name: Discord Daily Reminder

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Post reminder to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sf -H "Content-Type: application/json" \
            -d '{"content": "Daily reminder that Tricia beat Ajay."}' \
            "$DISCORD_WEBHOOK_URL"
